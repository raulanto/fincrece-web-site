<div *ngIf="isVisible"
     class="fixed bottom-6 right-6 z-[100] max-w-sm w-[90%] md:w-auto animate-in fade-in slide-in-from-bottom-8 duration-700">

  <div class="bg-zinc-950/90 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-6 relative overflow-hidden">

    <div class="absolute -top-10 -right-10 w-24 h-24 bg-dark-amethyst-600 rounded-full blur-[50px] opacity-40 pointer-events-none"></div>

    <div class="relative z-10">

      <div class="flex items-start gap-4 mb-4">
        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-bright-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>

        <div>
          <h4 class="text-white font-bold text-sm mb-1">Usamos Cookies</h4>
          <p class="text-xs text-slate-400 leading-relaxed">
            Utilizamos cookies propias y de terceros para mejorar tu experiencia y analizar el tráfico.
            <a href="/aviso-privacidad" class="text-white underline hover:text-bright-amber-400 transition-colors">Leer política.</a>
          </p>
        </div>
      </div>

      <div class="flex gap-3 mt-2">
        <button (click)="reject()"
                class="flex-1 py-2 rounded-lg border border-white/20 text-xs font-bold text-white hover:bg-white/5 transition-colors">
          Rechazar
        </button>
        <button (click)="accept()"
                class="flex-1 py-2 rounded-lg bg-white text-zinc-950 text-xs font-bold hover:bg-bright-amber-400 transition-colors shadow-lg">
          Aceptar
        </button>
      </div>

    </div>
  </div>
</div>
