<section class="relative w-full h-[600px] flex flex-col items-center justify-center bg-dark-amethyst-500 px-6 overflow-hidden">

  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-dark-amethyst-900/20 rounded-full blur-[100px]"></div>
  </div>

  <div class="relative z-10 w-full max-w-lg text-center">

    <h2 class="text-2xl md:text-3xl font-medium text-slate-300 mb-8 tracking-wide">
      ¿Cuánto deseas solicitar?
    </h2>

    <div class="mb-10">
      <div class="inline-flex items-baseline text-white">
        <span class="text-4xl md:text-5xl font-bold mr-2 text-dark-amethyst-400">$</span>
        <span class="text-6xl md:text-7xl font-bold tracking-tight">
          {{ amount | number:'1.0-0' }}
        </span>
      </div>
      <p class="text-sm text-slate-500 mt-2 font-medium uppercase tracking-widest">MXN</p>
    </div>

    <div class="relative w-full h-12 flex items-center mb-10 group">

      <div class="absolute w-full h-2 bg-zinc-800 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-dark-amethyst-600 to-bright-amber-400"
             [style.width]="getPercentage() + '%'"></div>
      </div>

      <input
        type="range"
        min="1000"
        max="150000"
        step="1000"
        [(ngModel)]="amount"
        class="absolute w-full h-full opacity-0 cursor-pointer z-20">

      <div class="absolute h-6 w-6 bg-white rounded-full shadow-[0_0_15px_rgba(255,255,255,0.5)] border-4 border-zinc-900 pointer-events-none transition-all duration-75 z-10 group-active:scale-125"
           [style.left]="'calc(' + getPercentage() + '% - 12px)'">
      </div>

    </div>

    <button
      (click)="goToDetails()"
      class="px-10 py-4 rounded-full bg-white text-zinc-950 font-bold text-sm tracking-wide hover:bg-bright-amber-400 hover:scale-105 transition-all duration-300 shadow-xl">
      Continuar Cotización
    </button>

<!--    <div class="flex justify-between text-xs text-white mt-8 px-2 font-mono">-->
<!--      <span>Min: $1,000</span>-->
<!--      <span>Max: $150,000</span>-->
<!--    </div>-->

  </div>
</section>
