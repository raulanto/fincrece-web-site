<section class="py-20 bg-slate-50 font-sans">
  <div class="container mx-auto px-6 lg:px-12">

    <div class="text-center mb-16">
      <h2 class="text-4xl lg:text-5xl font-bold text-dark-amethyst-500 mb-4 tracking-tight">
        Nuestros Productos
      </h2>
      <div class="h-1 w-24 bg-bright-amber-500 mx-auto rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">

      <div *ngFor="let product of products; let i = index"
           class="group relative bg-white rounded-2xl overflow-hidden shadow-lg border border-slate-100 hover:shadow-2xl hover:border-bright-amber-500/30 transition-all duration-500 flex flex-col h-[500px]"> <div class="relative h-1/2 overflow-hidden">
        <img [src]="product.image"
             [alt]="product.title"
             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">

        <div class="absolute inset-0 bg-gradient-to-t from-dark-amethyst-500 to-transparent opacity-80"></div>

        <div class="absolute bottom-4 left-4">
            <span class="px-3 py-1 bg-bright-amber-500 text-dark-amethyst-500 text-[10px] font-bold uppercase tracking-widest rounded-full shadow-md">
              {{ product.category }}
            </span>
        </div>
      </div>

        <div class="p-6 h-1/2 flex flex-col relative bg-white z-10">
          <h3 class="text-xl font-bold text-dark-amethyst-500 mb-3 leading-tight">
            {{ product.title }}
          </h3>

          <p class="text-slate-500 text-sm leading-relaxed mb-6 line-clamp-3">
            {{product.description}}
          </p>

          <button (click)="toggleDetails(i)"
                  class="mt-auto w-full py-3 rounded-xl border-2 border-dark-amethyst-500 text-dark-amethyst-500 font-bold text-sm hover:bg-dark-amethyst-500 hover:text-white transition-all duration-300 flex items-center justify-center gap-2 group/btn">
            <span>Ver Beneficios</span>
            <svg class="w-4 h-4 transform group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>

        <div class="absolute inset-0 bg-dark-amethyst-500 text-white p-6 transition-transform duration-500 ease-in-out z-20 flex flex-col"
             [class.translate-y-full]="!product.showDetails"
             [class.translate-y-0]="product.showDetails">

          <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
            <h4 class="font-bold text-bright-amber-500 text-sm uppercase tracking-wider">Beneficios Clave</h4>
            <button (click)="toggleDetails(i)" class="text-white/50 hover:text-white transition-colors">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>

          <div class="overflow-y-auto pr-2 custom-scrollbar flex-1 space-y-3">
            <div *ngFor="let feature of product.features" class="flex items-start gap-3">
              <svg class="w-4 h-4 text-bright-amber-500 mt-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              <p class="text-xs text-slate-300 leading-relaxed">{{ feature }}</p>
            </div>
          </div>

          <div class="mt-4 pt-4 border-t border-white/10">
            <a href="#contacto" class="block w-full text-center py-2 rounded-lg bg-bright-amber-500 text-dark-amethyst-500 text-xs font-bold hover:bg-white transition-colors">
              Solicitar Cotización
            </a>
          </div>

        </div>

      </div>

    </div>
  </div>
</section>
