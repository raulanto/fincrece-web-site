<nav class="absolute w-full top-0 z-50 py-6 transition-all duration-300">

  <div class="container mx-auto flex items-center justify-between px-6 lg:px-12">

    <a href="/public" class="flex items-center gap-3 group z-50">
      <div class="w-10 h-10 flex items-center justify-center rounded-full bg-dark-amethyst-800 text-white font-bold text-lg transition-colors duration-300 group-hover:bg-dark-amethyst-700">
        F
      </div>
      <span class="text-xl font-medium tracking-tight text-white transition-opacity duration-300 group-hover:opacity-90">
        Fincrece
      </span>
    </a>

    <div class="hidden md:flex items-center gap-10">

      <a href="#" class="text-sm font-medium text-white/80 hover:text-white transition-colors duration-300">
        Inicio
      </a>
      <a href="#nosotros" class="text-sm font-medium text-white/80 hover:text-white transition-colors duration-300">
        Nosotros
      </a>
      <a href="#servicios" class="text-sm font-medium text-white/80 hover:text-white transition-colors duration-300">
        Servicios especilizados
      </a>
      <a href="#convenios" class="text-sm font-medium text-white/80 hover:text-white transition-colors duration-300">
        Convenios
      </a>
      <a href="#contacto"
         class="px-6 py-2.5 rounded-full border border-white/20 text-white text-sm font-medium transition-all duration-300 hover:bg-white hover:text-dark-amethyst-900 hover:border-white">
        Contacto
      </a>
    </div>

    <div class="md:hidden relative z-50">
      <button (click)="toggleMenu()"
              class="text-white hover:text-bright-amber-500 transition-colors focus:outline-none p-2 group">
        <div class="w-6 h-6 flex flex-col justify-center items-end gap-1.5">
          <span [class.rotate-45]="isMenuOpen" [class.translate-y-2]="isMenuOpen"
                class="block w-6 h-0.5 bg-current transition-all duration-300 group-hover:bg-dark-amethyst-400"></span>
          <span [class.opacity-0]="isMenuOpen"
                class="block w-4 h-0.5 bg-current transition-all duration-300 group-hover:bg-dark-amethyst-400"></span>
          <span [class.-rotate-45]="isMenuOpen" [class.-translate-y-2]="isMenuOpen" [class.w-6]="isMenuOpen"
                class="block w-5 h-0.5 bg-current transition-all duration-300 group-hover:bg-dark-amethyst-400"></span>
        </div>
      </button>
    </div>
  </div>

  <div *ngIf="isMenuOpen"
       class="md:hidden fixed inset-0 top-0 bg-dark-amethyst-950/95 backdrop-blur-2xl border-b border-white/5 flex flex-col items-center justify-center space-y-8 z-40 animate-in fade-in zoom-in-95 duration-300">

    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-[20%] -right-[20%] w-96 h-96 bg-dark-amethyst-500/30 rounded-full blur-3xl"></div>
      <div class="absolute bottom-[10%] left-[10%] w-64 h-64 bg-bright-amber-500/10 rounded-full blur-3xl"></div>
    </div>

    <a href="#" (click)="closeMenu()"
       class="text-3xl font-serif text-white hover:text-bright-amber-500 transition-colors relative z-10">Inicio</a>
    <a href="#nosotros" (click)="closeMenu()"
       class="text-3xl font-serif text-white hover:text-bright-amber-500 transition-colors relative z-10">Nosotros</a>
    <a href="#servicios" (click)="closeMenu()"
       class="text-3xl font-serif text-white hover:text-bright-amber-500 transition-colors relative z-10">        Servicios especilizados</a>
    <a href="#convenios" (click)="closeMenu()"
       class="text-3xl font-serif text-white hover:text-bright-amber-500 transition-colors relative z-10">        Convenios</a>
    <a href="#contacto" (click)="closeMenu()"
       class="px-10 py-4 rounded-full bg-gradient-to-r from-bright-amber-500 to-bright-amber-500 text-black font-bold shadow-lg shadow-dark-amethyst-900/50 relative z-10 mt-4">
      Contactar Ahora
    </a>
  </div>
</nav>
