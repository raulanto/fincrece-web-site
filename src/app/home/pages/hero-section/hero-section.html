<div class="relative h-[100dvh] w-full overflow-hidden bg-white grid lg:grid-cols-12 font-sans">

  <div class="absolute top-0 left-0 w-full z-50">
    <app-nav-hero />
  </div>

  <div class="relative z-20 lg:col-span-7 flex flex-col justify-center px-6 lg:px-16 pt-32 pb-20 h-full bg-white shadow-[20px_0_40px_rgba(0,0,0,0.05)] overflow-hidden">

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0 opacity-[0.05] pointer-events-none select-none flex justify-center items-center w-full h-full">
      <img src="assets/logo-17.png"
           alt=""
           class="w-[80%] md:w-[60%] lg:w-[70%] h-auto object-contain grayscale opacity-95" />
    </div>
    <div class="max-w-3xl animate-fade-in-up mx-auto lg:mx-0 text-center lg:text-left relative z-10">

      <div class="inline-flex items-center gap-2 mb-8 px-4 py-2 rounded-full border border-slate-200 bg-slate-50 shadow-sm">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-bright-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-bright-amber-500"></span>
        </span>
        <span class="text-xs uppercase tracking-[0.2em] text-dark-amethyst-500 font-medium">17 años de experiencia Fincrece</span>
      </div>

      <h1 class="font-serif text-5xl lg:text-7xl text-dark-amethyst-500 leading-tight mb-6 tracking-tight">
        Fincrece S.A.P.I. <br/>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-dark-amethyst-500 to-dark-amethyst-950">
          de C.V., SOFOM
        </span>
      </h1>

      <p class="text-slate-600 text-lg mb-10 leading-relaxed max-w-xl mx-auto lg:mx-0">
        Transformamos vidas y comunidades a través del acceso justo, ágil y responsable al crédito.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
        <a href="#nosotros" class="group px-8 py-3 bg-dark-amethyst-500 text-white rounded-full font-bold hover:bg-dark-amethyst-700 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2">
          <span>Saber más</span>
          <svg class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
        </a>
        <a href="#cotizar" class="group px-8 py-3 border-2 border-dark-amethyst-600 text-dark-amethyst-700 rounded-full font-bold hover:bg-dark-amethyst-500 transition-all hover:text-white duration-300 flex items-center justify-center gap-2">
          <span>Cotizar Crédito</span>
        </a>
      </div>

    </div>
  </div>


  <div class="hidden lg:flex lg:col-span-5 relative h-full overflow-hidden bg-slate-50 justify-center gap-6 p-6 -skew-x-3 origin-bottom transform scale-105 border-l border-slate-100">

    <div class="absolute inset-0 z-20 pointer-events-none bg-gradient-to-b from-slate-50 via-transparent to-slate-50 h-full w-full"></div>

    <div class="w-1/2 h-full overflow-hidden relative group-col">
      <div class="ticker-up flex flex-col gap-6 w-full">
        <ng-container *ngFor="let item of column1.concat(column1)">
          <div class="relative h-[40vh] w-full rounded-2xl overflow-hidden group cursor-pointer shadow-md hover:shadow-xl transition-shadow duration-300 bg-white">
            <img [ngSrc]="item.src" fill class="object-cover transition-transform duration-700 group-hover:scale-110 group-hover:blur-[2px]" [alt]="item.title">
            <div class="absolute inset-0 bg-zinc-900/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10">
              <span class="text-white font-serif text-2xl font-bold tracking-widest uppercase border-b-2 border-bright-amber-400 pb-1 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                {{ item.title }}
              </span>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="w-1/2 h-full overflow-hidden relative group-col mt-12">
      <div class="ticker-down flex flex-col gap-6 w-full">
        <ng-container *ngFor="let item of column2.concat(column2)">
          <div class="relative h-[40vh] w-full rounded-2xl overflow-hidden group cursor-pointer shadow-md hover:shadow-xl transition-shadow duration-300 bg-white">
            <img [ngSrc]="item.src" fill class="object-cover transition-transform duration-700 group-hover:scale-110 group-hover:blur-[2px]" [alt]="item.title">
            <div class="absolute inset-0 bg-zinc-900/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10">
              <span class="text-white font-serif text-2xl font-bold tracking-widest uppercase border-b-2 border-bright-amber-400 pb-1 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                {{ item.title }}
              </span>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

  </div>
</div>
