<div class="flex flex-col h-[100dvh] w-full overflow-hidden bg-white font-sans">



  <div class="flex-1 relative grid lg:grid-cols-12 overflow-hidden">

    <div class="absolute top-0 left-0 w-full z-50">
      <app-nav-hero />
    </div>

    <div class="col-span-12 lg:col-span-7 relative z-20 flex flex-col justify-center h-full px-6 md:px-12 lg:px-20 bg-white shadow-[10px_0_30px_rgba(0,0,0,0.02)]">

      <div class="absolute inset-0 flex items-center justify-center overflow-hidden pointer-events-none opacity-[0.04]">
        <img src="assets/logo-17.png"
             class="w-[120%] max-w-none md:w-[80%] h-auto object-contain grayscale -rotate-6 transform scale-110"
             alt="" />
      </div>

      <div class="relative z-10 max-w-2xl mx-auto lg:mx-0 text-center lg:text-left mt-16 lg:mt-0">

        <div class="inline-flex items-center gap-2 mb-6 px-3 py-1.5 rounded-full border border-slate-100 bg-slate-50 shadow-sm backdrop-blur-sm">
          <span class="flex h-2 w-2 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-bright-amber-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-bright-amber-500"></span>
          </span>
          <span class="text-[10px] md:text-xs uppercase tracking-widest text-slate-500 font-bold">Bienvenidos a Fincrece</span>
        </div>

        <h1 class="font-serif text-4xl sm:text-5xl lg:text-7xl text-slate-900 leading-[1.1] mb-6 tracking-tight">
          Fincrece S.A.P.I. <br class="hidden sm:block"/>
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-500">
            de C.V., SOFOM
          </span>
        </h1>

        <p class="text-slate-500 text-base sm:text-lg lg:text-xl mb-8 leading-relaxed font-light mx-auto lg:mx-0 max-w-lg">
          Transformamos vidas y comunidades a través del acceso <strong class="text-slate-700 font-medium">justo, ágil y responsable</strong> al crédito.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start w-full sm:w-auto">
          <a href="#nosotros"
             class="group px-8 py-3.5 bg-dark-amethyst-600 text-white rounded-full font-bold hover:bg-dark-amethyst-700 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2 text-sm sm:text-base">
            <span>Saber más</span>
            <svg class="w-4 h-4 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
          </a>

          <a href="#cotizar"
             class="group px-8 py-3.5 border border-slate-200 text-slate-600 rounded-full font-bold hover:border-dark-amethyst-600 hover:text-dark-amethyst-700 hover:bg-white transition-all duration-300 flex items-center justify-center gap-2 text-sm sm:text-base">
            <span>Cotizar Crédito</span>
            <div class="w-1.5 h-1.5 rounded-full bg-bright-amber-500 group-hover:scale-125 transition-transform"></div>
          </a>
        </div>

      </div>
    </div>


    <div class="hidden lg:flex lg:col-span-5 relative h-full bg-slate-50 overflow-hidden border-l border-slate-100">

      <div class="absolute inset-0 z-20 pointer-events-none bg-gradient-to-b from-slate-50 via-transparent to-slate-50"></div>

      <div class="w-full h-full flex justify-center gap-6 p-8 -skew-x-3 scale-110 origin-bottom">

        <div class="w-1/2 h-full relative group-col">
          <div class="ticker-up flex flex-col gap-6">
            <ng-container *ngFor="let item of column1.concat(column1)">
              <div class="relative h-[35vh] w-full rounded-2xl overflow-hidden shadow-sm bg-white">
                <img [ngSrc]="item.src" fill class="object-cover" [alt]="item.title">
              </div>
            </ng-container>
          </div>
        </div>

        <div class="w-1/2 h-full relative group-col mt-16">
          <div class="ticker-down flex flex-col gap-6">
            <ng-container *ngFor="let item of column2.concat(column2)">
              <div class="relative h-[35vh] w-full rounded-2xl overflow-hidden shadow-sm bg-white">
                <img [ngSrc]="item.src" fill class="object-cover" [alt]="item.title">
              </div>
            </ng-container>
          </div>
        </div>

      </div>
    </div>

  </div>

  <div class="h-10 bg-dark-amethyst-500 shrink-0 flex items-center justify-center border-b border-white/5 relative">
    <div class="flex items-center gap-4 animate-fade-in px-4">
      <div class="hidden sm:block w-6 h-[1px] bg-slate-700"></div>
      <p class="text-[10px] md:text-xs text-slate-300 uppercase tracking-[0.2em] font-medium text-center truncate">
        <span class="text-bright-amber-400 font-bold">17 Años</span> de Solidez Financiera
      </p>
      <div class="hidden sm:block w-6 h-[1px] bg-slate-700"></div>
    </div>
  </div>
</div>
