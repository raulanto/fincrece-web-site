<section class="flex flex-col h-[100dvh] w-full overflow-hidden bg-white font-sans">

  <article class="h-10 bg-zinc-950 shrink-0 z-[60] flex items-center justify-center border-b border-white/5 relative">
    <div class="flex items-center gap-4 animate-fade-in px-4">
      <div class="hidden sm:block w-6 h-[1px] bg-slate-700"></div>
      <p class="text-[10px] md:text-xs text-slate-300 uppercase tracking-[0.2em] font-medium text-center truncate">
        <span class="text-bright-amber-500 font-bold">17 Años</span> de Solidez Financiera
      </p>
      <div class="hidden sm:block w-6 h-[1px] bg-slate-700"></div>
    </div>
  </article>

  <article class="flex-1 relative flex justify-center w-full overflow-hidden bg-slate-50">

    <nav class="absolute top-0 left-0 w-full z-50">
      <app-nav-hero />
    </nav>

    <article
      class="hidden lg:block w-[25%] h-full relative overflow-hidden bg-slate-100 group-col transform -skew-x-6 scale-125 origin-bottom z-0 border-r border-white/50">

      <div
        class="absolute inset-0 z-20 pointer-events-none bg-gradient-to-b from-slate-100 via-transparent to-slate-100 h-full w-full"></div>

      <div class="ticker-up flex flex-col gap-8 p-4 w-full">
        <ng-container *ngFor="let item of leftImages.concat(leftImages)">
          <div
            class="relative h-[35vh] w-full rounded-2xl overflow-hidden shadow-lg bg-white group cursor-pointer transform skew-x-6 hover:scale-105 transition-transform duration-500">
            <img [ngSrc]="item.src" fill class="object-cover transition-transform duration-700" [alt]="item.title">

            <div
              class="absolute inset-0 bg-zinc-950/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10">
              <span
                class="text-white font-serif text-lg font-bold tracking-widest uppercase border-b-2 border-bright-amber-400 pb-1">
                {{ item.title }}
              </span>
            </div>
          </div>
        </ng-container>
      </div>
    </article>


    <article class="relative z-30 flex flex-col justify-center items-center px-6 text-center w-full lg:w-[50%] py-20">

      <div class="flex justify-center mb-8 animate-fade-in-up">
        <div class="w-20 h-20 md:w-24 md:h-24 flex items-center justify-center  ">
          <img src="assets/logo-17.png" class="w-full h-full object-contain" alt="Fincrece Logo">
        </div>
      </div>
      <div
        class="inline-flex items-center gap-2 mb-8 px-4 py-2 rounded-full border border-slate-200 bg-white shadow-sm animate-fade-in-up delay-100">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-bright-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-bright-amber-500"></span>
        </span>
        <span class="text-xs uppercase tracking-[0.2em] text-slate-500 font-bold">Bienvenidos a Fincrece</span>
      </div>

      <h1
        class="font-serif text-4xl sm:text-5xl lg:text-7xl xl:text-8xl text-slate-900 leading-[1.1] mb-8 tracking-tight animate-fade-in-up delay-200 drop-shadow-sm">
        Fincrece S.A.P.I.
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-dark-amethyst-700 to-dark-amethyst-500">
          de C.V., SOFOM
        </span>
      </h1>

      <p
        class="text-slate-900 text-xl md:text-xl lg:text-2xl mb-10 leading-relaxed font-semibold max-w-2xl mx-auto animate-fade-in-up delay-300 tracking-wide">
        ¡Tu crecimiento nos ocupa!
      </p>

      <div class="flex flex-col sm:flex-row gap-3 justify-center items-center w-full animate-fade-in-up delay-400">
        <a href="#nosotros"
           class="group min-w-[180px] px-8 py-3 bg-dark-amethyst-600 text-white rounded-full font-bold hover:bg-dark-amethyst-700 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2">
          <span>Saber más</span>
          <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor"
               viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
          </svg>
        </a>

        <a href="#cotizar"
           class="group min-w-[180px] px-8 py-3 bg-white border-2 border-slate-200 text-slate-700 rounded-full font-bold hover:border-dark-amethyst-500 hover:text-dark-amethyst-500 hover:shadow-lg transition-all duration-300 flex items-center justify-center gap-2">
          <span>Cotizar Crédito</span>
          <div class="w-2 h-2 rounded-full bg-dark-amethyst-500 group-hover:scale-125 transition-transform"></div>
        </a>
      </div>

    </article>


    <article
      class="hidden lg:block w-[25%] h-full relative overflow-hidden bg-slate-100 group-col transform skew-x-6 scale-125 origin-bottom z-0 border-l border-white/50">

      <div
        class="absolute inset-0 z-20 pointer-events-none bg-gradient-to-b from-slate-100 via-transparent to-slate-100 h-full w-full"></div>

      <div class="ticker-down flex flex-col gap-8 p-4 w-full">
        <ng-container *ngFor="let item of rightImages.concat(rightImages)">
          <div
            class="relative h-[35vh] w-full rounded-2xl overflow-hidden shadow-lg bg-white group cursor-pointer transform -skew-x-6 hover:scale-105 transition-transform duration-500">
            <img [ngSrc]="item.src" fill class="object-cover transition-transform duration-700" [alt]="item.title">

            <div
              class="absolute inset-0 bg-zinc-950/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10">
              <span
                class="text-white font-serif text-lg font-bold tracking-widest uppercase border-b-2 border-bright-amber-400 pb-1">
                {{ item.title }}
              </span>
            </div>
          </div>
        </ng-container>
      </div>
    </article>

  </article>
</section>
